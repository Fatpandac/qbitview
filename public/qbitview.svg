<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="qbitview logo">
  <title>qbitview</title>
  <defs>
    <linearGradient id="qbvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="qbvShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="qbvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="256" height="256" rx="60" ry="60" fill="url(#qbvBg)"/>
  <!-- Subtle top-light shine -->
  <rect width="256" height="256" rx="60" ry="60" fill="url(#qbvShine)"/>

  <!-- Orbit ring (P2P swarm hint) -->
  <ellipse cx="128" cy="128" rx="96" ry="30" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" transform="rotate(-28 128 128)"/>

  <!-- q glyph: bowl -->
  <g filter="url(#qbvGlow)">
    <circle cx="104" cy="108" r="44" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <!-- q glyph: stem -->
    <line x1="148" y1="108" x2="148" y2="196" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <!-- Download chevron formed at stem tip -->
    <polyline points="118,180 148,210 178,180" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Data dots inside bowl (bit particles) -->
  <circle cx="88" cy="108" r="4" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="104" cy="108" r="4" fill="#ffffff" fill-opacity="0.65"/>
  <circle cx="120" cy="108" r="4" fill="#ffffff" fill-opacity="0.35"/>
</svg>
