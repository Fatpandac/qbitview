      <line x1="148" y1="108" x2="148" y2="196" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
      <polyline points="118,180 148,210 178,180" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="88" cy="108" r="4" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="104" cy="108" r="4" fill="#ffffff" fill-opacity="0.65"/>
      <circle cx="120" cy="108" r="4" fill="#ffffff" fill-opacity="0.35"/>
    </g>
