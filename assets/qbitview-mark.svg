<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="qbitview mark">
  <title>qbitview mark</title>
  <defs>
    <linearGradient id="qbvStroke" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- q glyph bowl -->
  <circle cx="104" cy="108" r="44" fill="none" stroke="url(#qbvStroke)" stroke-width="20" stroke-linecap="round"/>
  <!-- q glyph stem -->
  <line x1="148" y1="108" x2="148" y2="196" stroke="url(#qbvStroke)" stroke-width="20" stroke-linecap="round"/>
  <!-- Download chevron -->
  <polyline points="118,180 148,210 178,180" fill="none" stroke="url(#qbvStroke)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data dots -->
  <circle cx="86" cy="108" r="5" fill="#22D3EE"/>
  <circle cx="104" cy="108" r="5" fill="#3B82F6"/>
  <circle cx="122" cy="108" r="5" fill="#1E3A8A"/>
</svg>
